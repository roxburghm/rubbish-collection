[env:esp32-1732s019]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs

; Dependencies
lib_deps =
    lovyan03/LovyanGFX @ ^1.1.12
    esphome/ESPAsyncWebServer-esphome @ ^3.1.0
    esphome/AsyncTCP-esphome @ ^2.1.3
    bblanchon/ArduinoJson @ ^7.0.3
    h2zero/NimBLE-Arduino @ ^1.4.1
    tzapu/WiFiManager @ ^2.0.17

; Build flags for ESP32-1732S019 (Adjust pins as needed based on schematic)
; Assuming standard 1732S019 pinout (ST7789 or similar)
build_flags = 
    -D CORE_DEBUG_LEVEL=0
    ; -D BOARD_HAS_PSRAM ; Disabled due to read error
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
; User instructions: You may need to adjust the LovyanGFX configuration
; in src/LGFX_ESP32_1732S019.hpp if the display doesn't work out of the box.
