<head>

        </symbol>
    </svg>

    <!-- Add Device Modal -->
    <div id="add-device-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Add Device</h2>
            <div id="reader"></div>

            <div class="form-group">
                <label>Manual MAC Address</label>
                <input type="text" id="manual-mac" placeholder="XX:XX:XX:XX:XX:XX">
                <p class="hint">Enter MAC with colons, or scan Code 128</p>
            </div>
            <button onclick="addManualDevice()" class="primary">Add Device</button>
            <button onclick="startCamera()" class="modal-action">Scan Camera</button>
            <button onclick="stopCamera()" class="modal-action" id="stop-cam-btn" style="display:none;">Stop
                Camera</button>
        </div>
    </div>

    <div class="app-container">
        <header>
            <h1>Rubbish Collection</h1>
            <div class="wifi-indicator" id="wifi-status" title="Checking WiFi...">
                <svg viewBox="0 0 24 24" width="28" height="28">
                    <rect class="wifi-bar" data-bar="1" x="2" y="18" width="4" height="5" rx="1" />
                    <rect class="wifi-bar" data-bar="2" x="8" y="13" width="4" height="10" rx="1" />
                    <rect class="wifi-bar" data-bar="3" x="14" y="8" width="4" height="15" rx="1" />
                    <rect class="wifi-bar" data-bar="4" x="20" y="3" width="4" height="20" rx="1" />
                </svg>
            </div>
        </header>

        <main>
            <!-- Setup Section -->
            <section id="setup-section" class="card">
                <h2>Configuration</h2>
                <div class="form-group">
                    <label>Postcode</label>
                    <div class="input-group">
                        <input type="text" id="postcode" placeholder="W5 3JS">
                        <button onclick="searchAddress()">Search</button>
                    </div>
                </div>

                <div class="form-group" id="address-select-group" style="display:none;">
                    <label>Select Address</label>
                    <select id="address-select"></select>
                    <button onclick="saveAddress()" class="primary">Save Address</button>
                </div>

                <div class="current-config">
                    <p>UPRN: <span id="current-uprn">Loading...</span></p>
                    <p>Address: <span id="current-address">Loading...</span></p>
                </div>
            </section>

            <!-- Dashboard Section -->
            <section id="dashboard-section" class="card">
                <h2>Next Collection</h2>
                <div id="collection-preview">
                    <p class="muted centered">Loading schedule...</p>
                </div>
                <button onclick="refreshData()">Force Refresh</button>
            </section>

            <!-- Devices Section -->
            <section id="devices-section" class="card">
                <h2>E-Ink Displays</h2>
                <div class="device-list" id="device-list">
                    <div class="device-item">
                        <span>Scanning for devices...</span>
                    </div>
                </div>
                <div class="actions">
                    <button onclick="openModal()">Add Device</button>
                </div>
            </section>
        </main>

        <footer class="app-footer"
            style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px;">
            <p>Firmware Built: <span id="fw-version">Loading...</span></p>
            <a href="/update" target="_blank"
                style="text-decoration: none; background: #ea4335; color: white; padding: 6px 12px; border-radius: 4px; font-weight: 600; font-size: 0.9em;">OTA
                Update</a>
        </footer>
    </div>
    <script src="app.js?v=6"></script>
</body>

</html>
